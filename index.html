<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cayson.dev — pardon the dust</title>
  <meta name="description" content="cayson.dev is getting a redesign. The new site launches 10/30/26.">
  <meta name="theme-color" content="#f5f2eb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">

  <!-- Favicon: the bracket mark -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23385030'/%3E%3Cpath d='M33 14 L15 32 L33 50' fill='none' stroke='%23f5f2eb' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M40 26 L48 32 L40 38' fill='none' stroke='%23e29579' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* cayson.dev v2 brand tokens */
    :root {
      --forest: #385030;
      --blue-brand: #5e7f99;
      --coral-brand: #e29579;
      --cream: #f5f2eb;
      --slate: #262624;

      --bg: var(--cream);
      --surface: #ebe7dd;
      --text: var(--slate);
      --muted: #6b6a62;
      --border: rgba(38, 38, 36, 0.14);
      --green: var(--forest);          /* fills */
      --green-text: var(--forest);     /* green used as text/strokes */
      --blue: var(--blue-brand);
      --coral: var(--coral-brand);
      --on-green: var(--cream);
      --shadow: 0 1px 2px rgba(38, 38, 36, .04), 0 10px 28px -14px rgba(38, 38, 36, .18);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: var(--slate);
        --surface: #2f2f2c;
        --text: var(--cream);
        --muted: #b0aea5;
        --border: rgba(245, 242, 235, 0.14);
        --green-text: #8fae80;
        --shadow: 0 1px 2px rgba(0,0,0,.25), 0 10px 28px -14px rgba(0,0,0,.5);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: var(--slate);
      --surface: #2f2f2c;
      --text: var(--cream);
      --muted: #b0aea5;
      --border: rgba(245, 242, 235, 0.14);
      --green-text: #8fae80;
      --shadow: 0 1px 2px rgba(0,0,0,.25), 0 10px 28px -14px rgba(0,0,0,.5);
      color-scheme: dark;
    }

    /* ---------- Base ---------- */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      /* Dot-grid, same as the v2 hero — dots follow --border so they swap with the theme */
      background: radial-gradient(var(--border) 1.5px, transparent 2px) 0 0 / 24px 24px, var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      font-size: 17px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      transition: background-color .3s ease, color .3s ease;
      overflow-x: hidden;
    }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--coral); outline-offset: 3px; border-radius: 6px; }

    /* One edge inset for the header & footer corners — same on every device */
    :root { --edge: 24px; }

    .wrap {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
      padding-inline: clamp(16px, 5vw, 72px);
    }
    /* Header/footer span the full viewport so their corners sit exactly --edge from each side */
    .wrap.edge {
      max-width: none;
      padding-inline: var(--edge);
    }

    /* ---------- Header ---------- */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-block: var(--edge);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: 1.25rem;
      letter-spacing: -.01em;
    }
    .brand svg { width: 34px; height: 34px; flex: none; }
    .mark-lt { stroke: var(--green-text); }
    .mark-gt { stroke: var(--coral); }
    .brand .tld { color: var(--muted); font-weight: 400; }

    .theme-toggle {
      width: 40px; height: 40px;
      display: grid; place-items: center;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: transform .2s ease, border-color .2s ease;
    }
    .theme-toggle:hover { transform: rotate(-15deg); border-color: var(--green-text); }
    .theme-toggle svg { width: 18px; height: 18px; }
    .icon-sun { display: none; }
    :root[data-theme="dark"] .icon-sun { display: block; }
    :root[data-theme="dark"] .icon-moon { display: none; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .icon-sun { display: block; }
      :root:not([data-theme="light"]) .icon-moon { display: none; }
    }

    /* ---------- Main ---------- */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding-top: clamp(24px, 5vh, 64px);
      padding-bottom: clamp(56px, 11vh, 128px);
    }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 500;
      font-optical-sizing: auto;
      font-size: clamp(2.8rem, 7.5vw, 6.25rem);
      line-height: 1.02;
      letter-spacing: -.025em;
      margin: 0 0 clamp(14px, 1.6vw, 22px);
    }
    h1 em { font-style: italic; color: var(--green-text); }

    .lede {
      color: var(--muted);
      font-size: clamp(1.02rem, 0.9rem + 0.4vw, 1.25rem);
      line-height: 1.6;
      max-width: 36rem;
      text-wrap: balance;
      margin: 0 0 clamp(36px, 5vw, 64px);
    }

    /* Launch date */
    .launch {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .launch::before, .launch::after {
      content: "";
      width: 32px;
      height: 1px;
      background: var(--border);
    }
    .launch time {
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.05rem;
      font-weight: 500;
      letter-spacing: .02em;
      text-transform: none;
      color: var(--coral);
    }

    /* Countdown */
    .countdown {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(8px, 1.2vw, 18px);
      width: 100%;
      max-width: clamp(320px, 52vw, 680px);
    }
    .unit {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: clamp(16px, 1.6vw, 24px);
      padding: clamp(16px, 2.2vw, 30px) 6px clamp(12px, 1.6vw, 22px);
      box-shadow: var(--shadow);
    }
    .num {
      display: block;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 500;
      font-size: clamp(1.9rem, 4.6vw, 3.75rem);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.02em;
    }
    .label {
      display: block;
      margin-top: 8px;
      font-size: .72rem;
      font-weight: 500;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .launched {
      display: none;
      font-family: "Fraunces", Georgia, serif;
      font-size: 1.5rem;
      color: var(--green-text);
    }
    .is-live .countdown { display: none; }
    .is-live .launched { display: block; }

    /* ---------- Meta (former footer content, now under the countdown) ---------- */
    .meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 6px 10px;
      margin-top: clamp(28px, 3.5vw, 44px);
      font-size: .85rem;
      color: var(--muted);
    }
    .meta .sep { opacity: .5; }
    .meta a { text-decoration: none; }
    .meta a:hover { color: var(--green-text); }

    /* ---------- Entrance ---------- */
    .rise { opacity: 0; transform: translateY(14px); animation: rise .8s cubic-bezier(.22, 1, .36, 1) forwards; }
    .d1 { animation-delay: .05s; } .d2 { animation-delay: .15s; } .d3 { animation-delay: .25s; }
    .d4 { animation-delay: .35s; } .d5 { animation-delay: .45s; }
    @keyframes rise { to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition: none !important; }
      .rise { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="wrap edge">
    <header>
      <a class="brand" href="/" aria-label="cayson.dev home">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path class="mark-lt" d="M33 12 L13 32 L33 52" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <path class="mark-gt" d="M41 25 L50 32 L41 39" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>cayson<span class="tld">.dev</span></span>
      </a>
      <button class="theme-toggle" type="button" aria-label="Toggle light and dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>
  </div>

  <div class="wrap" style="flex:1;display:flex;">
    <main id="launch" style="width:100%;">
      <h1 class="rise d1">Pardon the <em>dust.</em></h1>
      <p class="lede rise d3">I'm taking the time to redesign my site from the ground up, to allow my projects to be seen in the best way possible.</p>

      <p class="launch rise d4">Arriving <time datetime="2026-10-30">10/30/26</time></p>

      <div class="countdown rise d5" role="timer" aria-live="off" aria-label="Countdown to launch">
        <div class="unit"><span class="num" id="cd-days">--</span><span class="label">Days</span></div>
        <div class="unit"><span class="num" id="cd-hours">--</span><span class="label">Hours</span></div>
        <div class="unit"><span class="num" id="cd-mins">--</span><span class="label">Minutes</span></div>
        <div class="unit"><span class="num" id="cd-secs">--</span><span class="label">Seconds</span></div>
      </div>
      <p class="launched">It's here — refresh to see the new site.</p>

      <div class="meta rise d5">
        <span>&copy; <span id="year">2026</span> cayson.dev</span>
        <span class="sep" aria-hidden="true">·</span>
        <a href="mailto:hello@cayson.dev">hello@cayson.dev</a>
      </div>
    </main>
  </div>

  <script>
    (function () {
      var root = document.documentElement;

      // Theme toggle — remembers choice when storage is available
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") root.setAttribute("data-theme", saved);
      } catch (e) {}

      document.querySelector(".theme-toggle").addEventListener("click", function () {
        var current = root.getAttribute("data-theme") ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        var next = current === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
      });

      document.getElementById("year").textContent = new Date().getFullYear();

      // Countdown — midnight Central Time, Oct 30, 2026
      var LAUNCH = new Date("2026-10-30T00:00:00-05:00").getTime();
      var main = document.getElementById("launch");
      var els = {
        d: document.getElementById("cd-days"),
        h: document.getElementById("cd-hours"),
        m: document.getElementById("cd-mins"),
        s: document.getElementById("cd-secs")
      };
      function pad(n) { return n < 10 ? "0" + n : String(n); }

      function tick() {
        var diff = LAUNCH - Date.now();
        if (diff <= 0) {
          main.classList.add("is-live");
          clearInterval(timer);
          return;
        }
        var s = Math.floor(diff / 1000);
        els.d.textContent = pad(Math.floor(s / 86400));
        els.h.textContent = pad(Math.floor(s % 86400 / 3600));
        els.m.textContent = pad(Math.floor(s % 3600 / 60));
        els.s.textContent = pad(s % 60);
      }
      var timer = setInterval(tick, 1000);
      tick();
    })();
  </script>
</body>
</html>
